[package]
name = "media_forge"
version = "0.1.0"
edition = "2021"
description = "Media playback runtime engine"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "media_forge"

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time"] }
parking_lot = "0.12"
flutter_rust_bridge = "=2.13.0-beta.6"
# NOTE: the `static` feature links FFmpeg archives into the cdylib so the
# bundled binary has no runtime dylib dependency (App Sandbox blocks
# absolute-path dylib loads). Keep in sync with a static-capable
# FFMPEG_DIR (see scripts/build-ffmpeg-macos-vt.sh, hook/build.dart).
ffmpeg-next = { version = "8.1.0", features = ["static"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
# GPU video enhancement lives in `pixel_surface::enhance`. The crate itself is
# platform-neutral (planner + deadline policy + a null backend); the `gpu`
# feature adds the Metal/wgpu implementation and is Apple-only, so it is
# enabled from the target-specific block below.
pixel_surface = { path = "../../pixel_surface/rust" }

[target.'cfg(target_vendor = "apple")'.dependencies]
pixel_surface = { path = "../../pixel_surface/rust", features = ["gpu"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[[bin]]
name = "media_bench"
path = "src/bin/media_bench.rs"

[dev-dependencies]
tempfile = "3.14"
