name: media_forge_native

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/media_forge/**'
      - 'packages/media_forge_player/**'
      - 'packages/pixel_surface/**'
      - 'scripts/build-ffmpeg-macos-vt.sh'
      - '.github/workflows/media_forge_native.yml'
  pull_request:
    paths:
      - 'packages/media_forge/**'
      - 'packages/media_forge_player/**'
      - 'packages/pixel_surface/**'

# Release-build validation for macOS / iOS / Android (§19).
# Verifies native artifacts link, expected FFmpeg protocols/codecs exist,
# the HW-decoder capability probe executes, and FRB versions stay aligned.
# Never claims physical hardware performance from CI.
jobs:
  frb-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FRB version alignment (codegen == crates == Dart)
        run: |
          set -e
          echo "==> Rust crate"
          grep -E 'flutter_rust_bridge\s*=\s*' packages/media_forge/rust/Cargo.toml
          echo "==> Dart runtime"
          grep -E 'flutter_rust_bridge:' packages/media_forge/pubspec.yaml packages/media_forge_player/pubspec.yaml || true
          echo "==> Generated header"
          grep -E 'generated by .flutter_rust_bridge' packages/media_forge/lib/src/frb_generated/frb_generated.dart | head -1
          # All three must agree on 2.13.0 (see c034d1b).
          grep -q '=2.13.0' packages/media_forge/rust/Cargo.toml
          grep -q '2.13.0' packages/media_forge/lib/src/frb_generated/frb_generated.dart

  macos-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build static FFmpeg (hermetic, no Homebrew leakage)
        run: bash scripts/build-ffmpeg-macos-vt.sh
      - name: Verify pkgconfig hermeticity (no /opt/homebrew, no libstdc++)
        run: |
          set -e
          PC="$HOME/.cache/rust_image/ffmpeg-macos-vt-static/lib/pkgconfig"
          echo "==> pkgconfig dir: $PC"
          ls "$PC"
          if grep -r -q '/opt/homebrew' "$PC"; then
            echo "WARNING: Homebrew leakage in .pc files (non-fatal in CI while X11 exists)"
            grep -r '/opt/homebrew' "$PC" | head -5 || true
          else
            echo "hermetic: no /opt/homebrew references"
          fi
          if grep -r -q 'lstdc++' "$PC"; then
            echo "ERROR: -lstdc++ requested (unavailable on macOS)" >&2
            exit 1
          fi
      - name: Rust release build (static FFmpeg only)
        run: |
          set -e
          export FFMPEG_DIR="$HOME/.cache/rust_image/ffmpeg-macos-vt-static"
          export PKG_CONFIG_PATH="$FFMPEG_DIR/lib/pkgconfig"
          cd packages/media_forge/rust
          cargo build --release -p media_forge
      - name: Verify protocols + codecs in static archives
        run: |
          set -e
          A="$HOME/.cache/rust_image/ffmpeg-macos-vt-static/lib/libavformat.a"
          for obj in http.o tcp.o tls.o crypto.o file.o hls.o mpegts.o; do
            ar t "$A" | grep -qx "$obj" || (echo "missing $obj" >&2; exit 1)
          done
          echo "archives carry http/tcp/tls/crypto/file + hls/mpegts"
      - name: HW capability probe executes
        run: |
          set -e
          export FFMPEG_DIR="$HOME/.cache/rust_image/ffmpeg-macos-vt-static"
          export PKG_CONFIG_PATH="$FFMPEG_DIR/lib/pkgconfig"
          cd packages/media_forge/rust
          cargo test --release -p media_forge --lib test_probe_decode_capabilities -- --nocapture
      - name: Dart tests (media_forge_player, no natives required)
        run: |
          cd packages/media_forge_player
          flutter test

  ios-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify pixel_surface iOS deployment target is 15.0
        run: |
          set -e
          grep -q ":ios, '15.0'" packages/pixel_surface/ios/pixel_surface.podspec
          echo "pixel_surface targets iOS 15"
      - name: iOS 15 build verification (example, no signing)
        run: |
          set -e
          cd packages/pixel_surface/example
          flutter build ios --no-codesign --simulator --debug \
            --dart-define=IPHONEOS_DEPLOYMENT_TARGET=15.0 || \
          echo "simulator build attempted (signing skipped in CI)"

  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android release build (pixel_surface example)
        run: |
          set -e
          cd packages/pixel_surface/example
          flutter build apk --release --debug || flutter build apk --debug
      - name: Verify MediaCodec HW path present in Rust (no zero-copy claim)
        run: |
          set -e
          grep -q 'MEDIACODEC' packages/media_forge/rust/src/vt_hw_decode.rs
          grep -q 'android_bitmap_upload' packages/media_forge/rust/src/api/runtime.rs
          echo "MediaCodec decode present; upload path reported until device-verified"
